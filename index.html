<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авет Маркарян</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <!-- ============ HERO (ШАПКА) ============ -->
      <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-grain"></div>

        <div class="hero-inner">
          <div class="hero-left">
            <div class="hero-photo-wrap">
              <div class="hero-photo-ring2"></div>
              <div class="hero-photo-ring"></div>
              <div class="hero-photo">
                <img src="images/avatar.png" alt="Авет Маркарян" />
              </div>
            </div>
          </div>

          <div class="hero-right">
            <div class="tag">
              Тур по всей России <span class="tag-year">2026</span>
            </div>
            <div class="hero-name">Авет<br /><em>Маркарян</em></div>
            <div class="hero-sub">Любовная лирика · Шансон</div>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="divider"></div>

        <!-- ============ СПИСОК КОНЦЕРТОВ ============ -->
        <div class="section">
          <div class="section-label">Концерты</div>

          <div class="concert-list">
            <!--
                        КАК ДОБАВИТЬ ФОТО ГОРОДА:
                        <div class="concert-card-bg" style="background-image: url('images/cities/tula.jpg')">
                    -->
            <div class="hero-sub">Пока нет</div>
          </div>
        </div>

        <!-- ============ ФУТЕР ============ -->
        <div class="footer-bar">
          <div class="footer-left">
            <span class="footer-name">Авет Маркарян</span>
            <a href="https://t.me/RafaelARA" class="footer-dev"
              >Разработка сайта</a
            >
          </div>
          <div class="social">
            <a href="https://vk.com/id210048253">
              <img src="images/vk.png" width="50" height="50" alt="VK" />
            </a>
            <a href="https://music.yandex.ru/artist/3176627">
              <img
                src="images/yandex.png"
                width="28"
                height="28"
                alt="Yandex Music"
              />
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
